<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#06060a;color:#f5f5f8;font-family:Inter,system-ui,sans-serif;position:relative}
  .bg{position:absolute;inset:0;background:
    radial-gradient(700px 520px at 82% 8%,rgba(124,92,255,.34),transparent 62%),
    radial-gradient(520px 420px at 4% 90%,rgba(255,92,208,.18),transparent 62%),
    radial-gradient(520px 420px at 10% 6%,rgba(63,228,255,.12),transparent 60%)}
  .grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:88px 88px;
    -webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 0%,#000 20%,transparent 82%)}
  .in{position:relative;padding:66px 70px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:16px}
  .mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:1.3rem;color:#08080d;
    background:linear-gradient(100deg,#3fe4ff,#7c5cff 40%,#ff5cd0 72%,#ffd36e);box-shadow:0 0 0 1px rgba(255,255,255,.16)}
  .who{font-size:1.32rem;font-weight:600;letter-spacing:-.01em}
  .who small{display:block;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#71718a;font-weight:400;margin-top:3px}
  h1{font-family:Anton,sans-serif;text-transform:uppercase;font-size:4.7rem;line-height:.9;letter-spacing:-.02em;font-weight:400;max-width:11ch}
  h1 .dim{color:transparent;-webkit-text-stroke:1.6px rgba(255,255,255,.44)}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .tags{display:flex;gap:9px;flex-wrap:wrap;max-width:660px}
  .tag{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:#a5a5b8;
    padding:9px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.035)}
  .url{font-family:'JetBrains Mono',monospace;font-size:.85rem;letter-spacing:.13em;text-transform:uppercase;color:#71718a;white-space:nowrap}
  svg.art{position:absolute;right:-104px;top:56px;width:560px;height:560px;opacity:.95}
</style></head>
<body>
<div class="bg"></div><div class="grid"></div>
<svg class="art" viewBox="0 0 600 600" aria-hidden="true">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3fe4ff"/><stop offset="50%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#ff5cd0"/></linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd36e"/><stop offset="55%" stop-color="#ff5cd0"/><stop offset="100%" stop-color="#7c5cff"/></linearGradient>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7c5cff" stop-opacity=".5"/><stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="300" cy="300" r="250" fill="url(#gl)"/>
  <g fill="none" stroke-linecap="round">
    <g transform="translate(300 300) rotate(8) scale(1 .46) translate(-300 -300)"><rect x="74" y="74" width="452" height="452" rx="154" stroke="url(#a)" stroke-width="11"/></g>
    <g transform="translate(300 300) rotate(-24) scale(1 .5) translate(-300 -300)"><rect x="108" y="108" width="384" height="384" rx="131" stroke="url(#b)" stroke-width="10"/></g>
    <g transform="translate(300 300) rotate(46) scale(1 .43) translate(-300 -300)"><rect x="142" y="142" width="316" height="316" rx="108" stroke="url(#a)" stroke-width="9"/></g>
    <g transform="translate(300 300) rotate(-62) scale(1 .52) translate(-300 -300)"><rect x="176" y="176" width="248" height="248" rx="85" stroke="url(#b)" stroke-width="8"/></g>
    <g transform="translate(300 300) rotate(80) scale(1 .4) translate(-300 -300)"><rect x="210" y="210" width="180" height="180" rx="62" stroke="url(#a)" stroke-width="7"/></g>
    <g transform="translate(300 300) rotate(-104) scale(1 .55) translate(-300 -300)"><rect x="244" y="244" width="112" height="112" rx="38" stroke="url(#b)" stroke-width="6"/></g>
  </g>
</svg>
<div class="in">
  <div class="top"><span class="mark">SD</span><span class="who">Suyash Dubey<small>Applied AI Engineer</small></span></div>
  <h1>Ship AI that <span class="dim">survives</span> production.</h1>
  <div class="row">
    <div class="tags">
      <span class="tag">AI MVP development</span><span class="tag">Agentic systems &amp; RAG</span>
      <span class="tag">AI consulting</span><span class="tag">Eval &amp; observability</span>
    </div>
    <span class="url">suyashdubey.com</span>
  </div>
</div>
</body></html>
